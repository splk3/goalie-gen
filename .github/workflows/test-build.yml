name: Test Build

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    # Run weekly on Saturday at 3:00 AM UTC (after super-linter runs)
    - cron: "0 3 * * 6"

permissions: {}

jobs:
  test-build:
    name: Test Gatsby Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          PREFIX_PATHS: "true"

      - name: Verify build output
        run: |
          if [ ! -d "public" ]; then
            echo "Error: public/ directory was not generated"
            exit 1
          fi
          echo "Build successful - public/ directory exists"
          ls -la public/
