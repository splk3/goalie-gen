---
name: Puck Retrieval Point Shot

description: Two shot puck retrieval with point shot.

drill_steps: |-
  1. Coach dumps puck into corner.
  2. Player retrieves puck while pressure is applied.
  3. Player passes back to the coach, then receives it back for a shot.
  4. Player posts up in front of the net for a screen.
  5. Second coach passes the point player a puck.
  6. Player gets a quick shot off.

coaching_focus_points: |-
  - Communicate pressure.
  - Small shuffles/adjustments with shooter.
  - Stay on stick angle of screen.

shooter_focus_points: |-
  - Quick shots.
  - Get in front of goalies eyes.
  - Recognize pressure.

