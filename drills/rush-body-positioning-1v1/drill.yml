---
name: Rush body positioning 1v1
description: 1v1 rush drill with wide support players to practice lateral movement, post positioning, and pass interception in game-like scenarios.

drill_steps: |-
  1. Play a 1v1 in the middle space with a line down the middle and two wide support players on the offensive side.
  2. Upon possession, players must pass to a support player before attacking the net.
  3. Support players can pass or shoot.
  4. If a turnover is caused on your offensive side, you can attack right away.
  5. Progress to 2v2 in the middle.

coaching_focus_points: |-
  - Work on side-to-side movement on your feet.
  - If pucks are in tight, slide to the post on lateral plays.
  - Break up passes with your stick.

shooter_focus_points: |-
  - Use speed to get around the player.
  - Anticipate the play.
  - Present your stick for passing options.

