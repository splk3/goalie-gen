---
name: 2v2 Angling Game

drill_steps: |-
  1. Coach dumps a puck behind either net to start the rep.
  2. The closest team goes behind the net to retrieve the puck.
  3. At the same time, the other team gaps up and angles the puck carrier.
  4. Players must go through the circle before fully engaging.
  5. Play 2v2 until the whistle for roughly 45-second shifts.

coaching_focus_points: |-
  - Gain as much depth as possible.
  - Recognize passing options.
  - Communicate teammates' options.

shooter_focus_points: |-
  - Maintain a good competitive gap.
  - Be creative with passes.
  - Backcheck hard.

