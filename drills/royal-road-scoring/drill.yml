name: Royal Road Scoring

description: 3v3 cross centerline.

drill_steps: |-
  This activity is 3v3 with a line down the center line. Any goal that crosses the mid line and is scored is with 3 pts. A normal goal is worth 1 pt.

coaching_focus_points: |-
  - Explosive movements for lateral plays.
  - Stay on feet as long as possible.
  - Communicate to teammates.

shooter_focus_points: |-
  - Use boards to your advantage.
  - Communicate with teammates.
  - Break up passes.

drill_image: royal-road-scoring.png

