name: 3v3 Interchange
drill_steps: |-
  1. In this activity, there can only be a maximum of two players in a zone.
  2. Players are encouraged to interchange with each other.
coaching_focus_points: |-
  - Recognize passing lanes.
  - Stay on feet as long as possible.
  - Stay on stick angle.
shooter_focus_points: |-
  - Communicate change.
  - Use all passing options.
  - Crash rebounds.
