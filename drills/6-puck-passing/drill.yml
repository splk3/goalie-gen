---
name: 6 Puck Passing

description: Chaos passing with stick handling.

drill_steps: |-
  In this activity, 6 players are in the middle, chaos stickhandling and passing and receiving with 6 lines of support players. On the whistle, inside players pass their puck back to their line and support players jump in the middle with new support players hopping in.

coaching_focus_points: |-
  - Doing this with the shooters.
  - Keep high hand elbow up.
  - Grip the stick with glove to control puck.

shooter_focus_points: |-
  - Clean passes.
  - Eyes up while stick handling and passes.
  - Communicate to avoid collisions.

