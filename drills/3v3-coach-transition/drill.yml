---
name: 3v3 Coach Transition

description: 3v3 transition when players miss net.

drill_steps: |-
  1. Two teams (Navy and Gold) play 3v3, each trying to score on the opposing goalie.
  2. If a shot misses the net and the puck goes below the dot line, the opposing team's coach passes a new puck out to their team.
     - Ex. Gold shoots, misses, and the puck crosses the dot line --> Navy coach passes a puck to Navy.
  3. If a team scores, they get the puck back and receive a pass from their own coach.
     - Ex. Navy scores --> Navy regroups with the Navy coach.
  4. Waiting players are on the bench and change on the whistle.

  Point system:
  - Royal road goals = 3 pts
  - Causing a 1v1 turnover = 1 pt
  - Goal from "the house" = 3 pts

coaching_focus_points: |-
  - Challenge shooter.
  - Track all the way into your body.
  - Recognize passing options.

shooter_focus_points: |-
  - Heads up before shot.
  - Proper zone entry.
  - Back check hard.

