---
name: Overspeed Warm Up

description: |-
  Full ice skating with angle change shot.

drill_steps: |-
  In this activity, players will skate as shown in the diagram, receive a pass from the
  opposite line, make a move on the pad and shoot on the goalie. Players start at 70%
  speed and each rep add 10% speed. At rep 4, all skaters should be skating 100% speed.
  The goal of this activity is to develop speed. Switch sides after 3 reps at 100%.

coaching_focus_points: |-
  - Only change angle when puck is shifted do not follow shooters body.
  - Gain depth once they hit the red line.
  - Focus on tracking the puck all the way into your body.

shooter_focus_points: |-
  - Focus on lengthening stride.
  - Carry the puck with one hand on your stick.
  - Quick release of the shot right after you get around the pad and follow rebound.

