---
name: 2v2 Designated Shooter

drill_steps: |-
  1. Set up two designated shooters on the walls at the top of the zone on each offensive side, with a 2v2 battle in the middle.
  2. Coach dumps the puck in — whichever team wins possession must pass to their designated shooter up top.
  3. Only the shooters can take shots on net; before shooting, they need at least one D-to-D pass across the top.
  4. Net-front players battle, screen, and work to get pucks back up top.
  5. Shooters move the puck quickly side-to-side and find shooting lanes.
  6. Net-front defenders box out and clear lanes for the goalies.

  Optional Rule: Add a big circle to the net-front area. Any goal scored with a player in that circle is worth two points. The goal is to emphasize players going to the net and defensemen clearing out.

coaching_focus_points: |-
  - Track puck throughout the zone.
  - Communicate to teammates screens and threats.
  - Make sure you're on the stick angle of the puck.

shooter_focus_points: |-
  - Communication with teammates.
  - Quick accurate passes.
  - Get in front of goalies eyes.

