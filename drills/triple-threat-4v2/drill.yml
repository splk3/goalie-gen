---
name: Triple Threat 4v2

description: 4v2 in front of the net.

drill_steps: |-
  In this activity, it is a 4v2 in front of the net. The offensive players are relatively stationary, with the defensive players free to move and pressure. Offensive players must be ready to pass and shoot quick for success.

coaching_focus_points: |-
  - Track puck on feet.
  - Don't over challenge on depth.
  - Track all the way into body.

shooter_focus_points: |-
  - Crisp direct passes.
  - Defense get in lanes and block shots.
  - Communicate.

