---
name: 1 Net 3v2 Game

description: 3v2 on two sides with one net.

drill_steps: |-
  1. Play 3v2 on each side of the ice with a line down the middle.
  2. Players cannot go to the other side, and teams can only score on their offensive side of the ice that has 3 players.
  3. Defensive players cannot shoot the puck, but must pass it to the players on the offensive half.

coaching_focus_points: |-
  - Stay on angle.
  - Don't over commit to the shot.
  - Use stick to break up passes.

shooter_focus_points: |-
  - Create rebounds.
  - Put sticks in passing lanes.
  - Use the boards to your advantage.

